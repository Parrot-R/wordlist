name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifest & corpus load
        run: python3 scripts/validate.py
      - name: Run recall demo (smoke test)
        run: python3 examples/recall_demo.py
      - name: Run string-composition demo (smoke test)
        run: python3 examples/ensemble_demo.py
      - name: Run invisible-character demo (smoke test)
        run: python3 examples/invisible_demo.py
